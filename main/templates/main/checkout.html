{% extends 'main/base.html' %}
{% block title %}Оформление заказа{% endblock %}
{% block content %}
<h1>Оформление заказа</h1>

<div style="background:#fff;padding:30px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.06);max-width:600px;margin:0 auto;">
    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>{{ form.address.label }}</label>
            {{ form.address }}
        </div>

        <div class="form-group">
            <label>{{ form.phone.label }}</label>
            {{ form.phone }}
            <small style="color:#7f8c8d;">Формат: 8 (999) 123-45-67</small>
        </div>

        <div class="form-group">
            <label>{{ form.delivery_method.label }}</label>
            {{ form.delivery_method }}
        </div>

        <div class="form-group">
            <label>{{ form.delivery_date.label }}</label>
            {{ form.delivery_date }}
        </div>

        <div class="form-group">
            <label>{{ form.payment_method.label }}</label>
            <div style="padding:10px 0;">{{ form.payment_method }}</div>
        </div>

        <div class="actions">
            <button type="submit" class="btn">Подтвердить заказ</button>
            <a href="{% url 'cart' %}" class="btn btn-outline">Назад</a>
        </div>
    </form>
</div>
{% endblock %}
