{% extends 'main/base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="form-container">
    <h1>Вход</h1>
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Логин</label>
            {{ form.username }}
        </div>
        <div class="form-group">
            <label>Пароль</label>
            {{ form.password }}
        </div>
        <button type="submit" class="btn" style="width:100%;">Войти</button>
    </form>
    <p class="auth-link">
        Еще не зарегистрированы? <a href="{% url 'register' %}">Регистрация</a>
    </p>
</div>
{% endblock %}
